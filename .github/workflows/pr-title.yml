# The pull request title becomes the squash commit on main, and the release version is computed
# from those commits (cliff.toml). A title that is not a Conventional Commit would be ignored
# by the release, so it fails here.
name: pr-title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  conventional-title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([a-z0-9._/-]+\))?!?: [^ ].*$'
          if ! printf '%s\n' "$PR_TITLE" | grep -Eq "$pattern"; then
            echo "::error::The title \"$PR_TITLE\" is not a Conventional Commit."
            echo "Expected: type(scope): description  (types: feat, fix, perf, refactor, docs, test, build, ci, chore, style, revert; add ! before the colon for a breaking change)."
            exit 1
          fi
