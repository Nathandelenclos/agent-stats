# Checks every pull request and every push to main. On a push to main, the release job runs once the checks passed.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test (race detector)
        run: go test -race ./...
      - name: Build
        run: go build -o /dev/null .
      # The release ships these six targets; a cross-compilation failure must show up here,
      # not at release time. The SQLite driver is pure Go, so no cgo is needed.
      - name: Cross-compile the release targets
        env:
          CGO_ENABLED: "0"
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "build $target"
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null .
          done

  # Releases what these checks just validated: the release workflow tags, builds and attests this very commit.
  # It never runs on a pull request. When the web job below is enabled, add it to `needs`.
  release:
    name: Release
    needs: go
    if: github.event_name == 'push'
    permissions:
      contents: write # push the tag, create the GitHub release
      id-token: write # sign the build provenance attestation
      attestations: write
    uses: ./.github/workflows/release.yml

  # Placeholder for the future web front (web/). Its dist/ is NOT versioned: it is built on demand,
  # here and in the release workflow. Enable this job when web/package.json exists, then add it
  # to the build that embeds the front in the binary. Nothing runs today, so nothing can fail.
