# Checks every pull request and every push to main. On a push to main, the release job runs once the checks passed.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A pull request run is cancelled by the next push to the same pull request. A push run gets a group of its own, so it is
# never cancelled and never replaced while pending: a shared group keeps a single pending run, and an older re-run
# joining it would evict a newer run that covers more commits. The release job serializes those runs (release.yml).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # The front is not versioned: it is built here with the same commands as the release's front job (web/doc.go). `go generate ./web` runs
      # `npm ci` (the lockfile, install scripts off through web/.npmrc) then `npm run build`, which type-checks
      # the sources with tsc before bundling them.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web front
        run: go generate ./web
      # The front's own tests (Vitest, in jsdom), run on the dependencies the build just installed.
      - name: Test the web front
        working-directory: web
        run: npm test
      # Both flavours of the binary: the plain build embeds the notice that says how to build the front, the web tag
      # embeds the front just built.
      - name: Vet
        run: |
          go vet ./...
          go vet -tags web ./...
      # Known vulnerabilities in the code the module actually calls, in its dependencies and in the standard library.
      # Run from a pinned version with `go run`: nothing is installed.
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: Test (race detector)
        run: go test -race -tags web ./...
      - name: Build
        run: |
          go build -o /dev/null .
          go build -tags web -o /dev/null .
      # The release ships these six targets; a cross-compilation failure must show up here,
      # not at release time. The SQLite driver is pure Go, so no cgo is needed.
      - name: Cross-compile the release targets
        env:
          CGO_ENABLED: "0"
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "build $target"
            GOOS=${target%/*} GOARCH=${target#*/} go build -tags web -o /dev/null .
          done

  # Releases what these checks just validated: the release workflow tags, builds and attests this very commit.
  # It never runs on a pull request. It builds the front in a job of its own (see release.yml) rather than reusing this job's.
  release:
    name: Release
    needs: go
    if: github.event_name == 'push'
    permissions:
      contents: write # push the tag, create the GitHub release
      id-token: write # sign the build provenance attestation
      attestations: write
    uses: ./.github/workflows/release.yml
    # Only this secret, not `secrets: inherit`. Optional, and read by one job that cannot write (release.yml).
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
