# Publishes a release when commits that count (feat, fix, perf, breaking change) reached main and CI passed.
#
# The next version is computed from the Conventional Commits since the last tag (git-cliff, see
# cliff.toml). Nothing is versioned or written to the repository by hand: the tag is the only artefact.
# The binaries are built once, by GoReleaser, from the commit CI validated.
#
# Idempotent: it does nothing when no commit is releasable, and never moves or re-creates a tag. If a
# run fails after pushing the tag, re-running it only publishes the missing release for that same tag.
name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One release at a time; a run is queued, never cancelled in the middle of a publication.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish
    # Only a green CI run on a push to main (not a pull request, not a failure).
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # push the tag, create the GitHub release
      id-token: write # sign the build provenance attestation
      attestations: write
    steps:
      # The exact commit CI validated, with the whole history and the tags (git-cliff needs both).
      # The token is kept to push the tag; no step runs code that is not pinned below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # syft generates the SBOM of each archive (sboms in .goreleaser.yaml).
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.57.1
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: git-cliff@2.14.2

      - name: Decide whether there is something to release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          existing=$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | sed -n 1p)

          if [ -n "$existing" ]; then
            # This commit is already tagged (a previous run stopped before publishing): never re-tag.
            version=$existing
            if gh release view "$version" >/dev/null 2>&1; then
              echo "::notice::$version is already released: nothing to do."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::notice::$version exists but has no release yet: publishing it."
            create_tag=false
          else
            # A release needs a feat, a fix, a perf or a breaking change since the last tag.
            range=HEAD
            [ -n "$latest" ] && range="$latest..HEAD"
            subjects=$(git log --format=%s "$range")
            bodies=$(git log --format=%b "$range")
            subject_pattern='^((feat|fix|perf)(\([^)]*\))?!?|[a-z]+(\([^)]*\))?!): '
            if ! grep -Eq "$subject_pattern" <<<"$subjects" && ! grep -Eq '^BREAKING[ -]CHANGE: ' <<<"$bodies"; then
              echo "::notice::No releasable commit since ${latest:-the beginning}: nothing to do."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            version=$(git-cliff --bumped-version)
            create_tag=true
          fi

          printf '%s\n' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [ "$create_tag" = true ] && git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "::error::$version already exists on another commit; refusing to move a tag."
            exit 1
          fi

          if [ "$create_tag" = false ]; then
            git-cliff --current --strip header -o "$RUNNER_TEMP/notes.md"
          else
            git-cliff --unreleased --tag "$version" --strip header -o "$RUNNER_TEMP/notes.md"
            if [ -n "$latest" ]; then
              printf '\n**Full changelog**: https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$latest" "$version" >> "$RUNNER_TEMP/notes.md"
            fi
          fi
          grep -q '^### ' "$RUNNER_TEMP/notes.md" || { echo "::error::git-cliff produced no release notes for $version."; exit 1; }

          {
            echo "release=true"
            echo "version=$version"
            echo "create_tag=$create_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Create the tag
        if: steps.plan.outputs.release == 'true' && steps.plan.outputs.create_tag == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          git tag "$VERSION" HEAD
          git push origin "refs/tags/$VERSION"

      - name: Build the binaries and publish the release
        if: steps.plan.outputs.release == 'true'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.3
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Attest the build provenance
        if: steps.plan.outputs.release == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
