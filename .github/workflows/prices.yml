name: Publish model prices

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-model-prices
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'Nathandelenclos/agent-stats' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      snapshot-sha: ${{ steps.generate.outputs.snapshot-sha }}
      litellm-sha: ${{ steps.generate.outputs.litellm-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Generate prices from a LiteLLM commit
        id: generate
        run: |
          set -euo pipefail
          revision=$(git ls-remote --exit-code https://github.com/BerriAI/litellm.git refs/heads/main | cut -f1)
          go run ./internal/pricing/infra/pricetable/gen -commit "$revision" -output "$RUNNER_TEMP/prices.json"
          test "$(wc -c < "$RUNNER_TEMP/prices.json")" -le 16777216
          snapshot_sha=$(sha256sum "$RUNNER_TEMP/prices.json" | cut -d " " -f1)
          echo "snapshot-sha=$snapshot_sha" >> "$GITHUB_OUTPUT"
          echo "litellm-sha=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: artifact
        with:
          name: model-prices
          path: ${{ runner.temp }}/prices.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.generate.outputs.artifact-id }}
          path: ${{ runner.temp }}/snapshot
      - name: Publish changed prices to pricing-data
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_SHA: ${{ needs.generate.outputs.snapshot-sha }}
          LITELLM_SHA: ${{ needs.generate.outputs.litellm-sha }}
        run: |
          set -euo pipefail
          [[ "$LITELLM_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SNAPSHOT_SHA" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$SNAPSHOT_SHA" "$RUNNER_TEMP/snapshot/prices.json" | sha256sum -c -
          gh auth setup-git --hostname github.com
          git init "$RUNNER_TEMP/pricing-data"
          cd "$RUNNER_TEMP/pricing-data"
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          status=0
          git ls-remote --exit-code origin refs/heads/pricing-data > /dev/null || status=$?
          case "$status" in
            0)
              git fetch --depth=1 origin refs/heads/pricing-data
              git switch -c pricing-data FETCH_HEAD
              ;;
            2) git switch --orphan pricing-data ;;
            *) exit "$status" ;;
          esac
          cp "$RUNNER_TEMP/snapshot/prices.json" prices.json
          git add -- prices.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore: refresh prices from LiteLLM $LITELLM_SHA"
          git push origin HEAD:refs/heads/pricing-data
