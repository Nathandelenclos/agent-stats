# GoReleaser configuration, run by .github/workflows/release.yml on a tag it has just created.
# The version comes from the git tag (computed by git-cliff); the release notes are supplied with
# --release-notes, so GoReleaser's own changelog is disabled.
version: 2

project_name: agent-stats

# The web front is not versioned: build it before compiling. `go generate ./web` runs `npm ci` then `npm run build`
# (web/doc.go); the `web` build tag below embeds web/dist in every binary.
before:
  hooks:
    - go generate ./web

builds:
  - id: agent-stats
    main: .
    binary: agent-stats
    # The SQLite driver (modernc.org/sqlite) is pure Go: static binaries, no C toolchain.
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -tags=web
    ldflags:
      - -s -w
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: agent-stats
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# One SBOM (syft, installed by the workflow) per archive, uploaded next to it and listed in checksums.txt.
sboms:
  - artifacts: archive

changelog:
  disable: true

# The release is created as a draft after the workflow pushed the tag; the workflow publishes it once the
# build provenance is attested. A draft left by a failed run is replaced by the next one.
release:
  draft: true
  replace_existing_draft: true
