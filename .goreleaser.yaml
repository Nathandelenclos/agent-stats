# GoReleaser configuration, run by .github/workflows/release.yml on a tag it has just created.
# The version comes from the git tag (computed by git-cliff); the release notes are supplied with
# --release-notes, which replaces GoReleaser's own changelog.
version: 2

project_name: agent-stats

# The web front is not versioned. The workflow builds it in a job of its own and drops it in web/dist before this runs;
# the `web` build tag below embeds web/dist in every binary, and the build fails without it. Nothing here builds the front:
# this runs with the rights to publish and sign.

builds:
  - id: agent-stats
    main: .
    binary: agent-stats
    # The SQLite driver (modernc.org/sqlite) is pure Go: static binaries, no C toolchain.
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -tags=web
    ldflags:
      - -s -w
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: agent-stats
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      # The front is bundled into the binary: its lockfile, shipped in the archive under its own name (syft only reads a
      # file called package-lock.json), lets the SBOM below list the npm packages that are inside it, next to the Go modules.
      - src: web/package-lock.json
        dst: web/package-lock.json

nfpms:
  - ids: [agent-stats]
    formats: [deb, rpm, apk]
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    homepage: https://github.com/Nathandelenclos/agent-stats
    maintainer: Nathan Delenclos <91780909+Nathandelenclos@users.noreply.github.com>
    description: Usage statistics for AI coding agents based on local session logs
    license: MIT
    contents:
      - src: LICENSE
        dst: /usr/share/doc/agent-stats/copyright

checksum:
  name_template: checksums.txt
  algorithm: sha256

# One SBOM (syft, installed by the workflow) per archive, uploaded next to it and listed in checksums.txt.
sboms:
  - artifacts: archive

# No changelog section: --release-notes supplies the notes git-cliff wrote. (`changelog: disable: true` would also
# drop that file and publish an empty release body, as v0.1.0 and v0.2.0 were.)

# The release is created as a draft after the workflow pushed the tag; the workflow publishes it once the
# build provenance is attested. A draft left by a failed run is replaced by the next one.
release:
  draft: true
  replace_existing_draft: true
